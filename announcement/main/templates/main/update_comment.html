{% extends 'base.html' %}

{% block title %} Commentni tahrirlash {% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="fw-bold mb-4">Commentni tahrirlash</h3>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.text }}
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Saqlash</button>
                            <a href="{% url 'detail' comment.re_announcement.id %}" class="btn btn-outline-secondary">Bekor qilish</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
